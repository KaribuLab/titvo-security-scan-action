name: 'Titvo Code Scanner'
description: 'Escanea código usando la API de Titvo'
inputs:
  titvo_api_endpoint:
    description: Titvo API Endpoint
    required: true
  titvo_api_key:
    description: 'API Key de Titvo'
    required: true
  github_token:
    description: 'Token de GitHub para acceder al repositorio'
    required: true
  github_repo_name:
    description: 'Nombre del repositorio en formato usuario/repo'
    required: true
  github_commit_sha:
    description: 'SHA del commit a escanear'
    required: true
    default: ${{ github.sha }}
  github_assignee:
    description: 'Usuario de GitHub al que se asignará el issue en caso de problemas'
    required: true
    default: ${{ github.actor }}
  github_branch:
    description: 'Branch a escanear'
    required: true
    default: ${{ github.ref_name }}
  scan_mode:
    description: 'Necesitas full scan o solo para el commit'
    required: false
    default: 'commit'

  slack_webhook_url:
    description: 'Webhook de Slack (excluyente con slack_bot_token; canal fijado en Slack)'
    required: false
  no_fail:
    description: 'Si es true, los fallos de Titvo no fallan el pipeline; conserva logs y notificaciones a Slack'
    required: false
    default: 'false'
  slack_bot_token:
    description: 'Bot token de Slack con chat:write (excluyente con slack_webhook_url)'
    required: false
  slack_channel:
    description: 'ID del canal de Slack; obligatorio y válido solo con slack_bot_token. No usar con webhook'
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    NO_FAIL: ${{ inputs.no_fail }}
    SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
    SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
    SLACK_CHANNEL: ${{ inputs.slack_channel }}
  args:
    - ${{ inputs.titvo_api_endpoint }}
    - ${{ inputs.titvo_api_key }}
    - ${{ inputs.github_token }}
    - ${{ inputs.github_repo_name }}
    - ${{ inputs.github_commit_sha }}
    - ${{ inputs.github_assignee }}
    - ${{ inputs.github_branch }}
    - ${{ inputs.scan_mode }}
branding:
  icon: 'shield'
  color: 'blue'
